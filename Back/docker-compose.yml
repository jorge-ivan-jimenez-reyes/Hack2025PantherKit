version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: career_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: career_recommendations
    volumes:
      - mongodb_data:/data/db
      - ./mongodb-init:/docker-entrypoint-initdb.d
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    deploy:
      resources:
        limits:
          memory: 6G  # Aumentado para modelos Transformer
        reservations:
          memory: 3G
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      - MONGODB_URL=mongodb://admin:admin123@mongodb:27017/career_recommendations?authSource=admin
      - DEBUG=True
      - TF_CPP_MIN_LOG_LEVEL=2  # Reducir nivel de logs de TensorFlow
      - PYTHONPATH=/app

volumes:
  mongodb_data: 